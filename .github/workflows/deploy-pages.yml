name: Deploy Journey Desk to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: modules/luggage/package-lock.json
      - name: Install integrated module
        run: npm ci --prefix modules/luggage
      - name: Test luggage integration
        run: npm test --prefix modules/luggage
      - name: Build integrated site
        run: |
          npm run build --prefix modules/luggage
          node scripts/build-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site-build
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

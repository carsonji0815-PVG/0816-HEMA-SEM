# Only password-grant authentication requests consume this rate-limit zone.
# Empty keys are not tracked, so REST, Storage and Edge Function traffic keeps
# its existing behavior.
map $arg_grant_type $lilly_auth_limit_key {
    default  "";
    password $binary_remote_addr;
}

limit_req_zone $lilly_auth_limit_key zone=lilly_auth_login:10m rate=10r/m;
